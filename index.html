<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Para minha Laninha ❤️</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    font-family: Arial, sans-serif;
    text-align: center;
    color: white;
    overflow: hidden;
}

.container {
    margin-top: 120px;
}

h1 {
    font-size: 42px;
}

p {
    font-size: 20px;
}

button {
    background: white;
    color: #ff4d6d;
    border: none;
    padding: 15px 25px;
    font-size: 18px;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
    background: #ffe6ec;
}

.heart {
    position: fixed;
    font-size: 20px;
    animation: subir 6s linear infinite;
}

@keyframes subir {
    from {
        transform: translateY(100vh);
        opacity: 1;
    }
    to {
        transform: translateY(-10vh);
        opacity: 0;
    }
}

.msg {
    margin-top: 20px;
    font-size: 22px;
    opacity: 0;
    transform: translateY(-200px);
    transition: 0.5s;
}

.final {
    margin-top: 20px;
    font-size: 26px;
    opacity: 0;
    transition: 2s;
}
</style>
</head>

<body>

<div class="container">
    <h1>Para minha Laninha 💖</h1>
    <p>Você é a melhor coisa que me aconteceu ❤️</p>

    <button id="btn" onclick="iniciar()">Clique aqui 💘</button>

    <div class="msg" id="msg"></div>
    <div class="final" id="final">💞 Eu te amo mais do que tudo 💞</div>

    <br><br>

    <audio id="musica" preload="auto">
        <source src="musica.mp3" type="audio/mpeg">
    </audio>
</div>

<script>
const texto = `
Eu amo o seu sorriso 💖<br><br>
Eu amo o jeito que você me faz feliz todos os dias ✨<br><br>
Eu amo cada momento ao seu lado 💘<br><br>
Eu amo quando você fala comigo e tudo fica melhor ❤️<br><br>
Eu amo você por completa, do jeitinho que você é 💞<br><br>
E vou continuar te amando cada dia mais... 💖
`;

function iniciar() {
    const musica = document.getElementById("musica");
    const btn = document.getElementById("btn");

    btn.style.display = "none";

    musica.volume = 0;
    musica.play();

    let vol = 0;
    const fade = setInterval(() => {
        if (vol < 1) {
            vol += 0.05;
            musica.volume = vol;
        } else {
            clearInterval(fade);
        }
    }, 200);

    escreverTexto();
}

function escreverTexto() {
    const msg = document.getElementById("msg");

    msg.innerHTML = texto;
    msg.style.opacity = 1;

    let pos = -200;

    const animar = setInterval(() => {
        if (pos < 0) {
            pos += 2;
            msg.style.transform = `translateY(${pos}px)`;
        } else {
            clearInterval(animar);
            mostrarFinal();
        }
    }, 20);
}

function mostrarFinal() {
    const final = document.getElementById("final");

    setTimeout(() => {
        final.style.opacity = 1;
    }, 1000);
}

// corações
function criarCoracao() {
    const coracao = document.createElement("div");
    coracao.classList.add("heart");
    coracao.innerHTML = "❤️";

    coracao.style.left = Math.random() * 100 + "vw";
    coracao.style.fontSize = (Math.random() * 20 + 10) + "px";

    document.body.appendChild(coracao);

    setTimeout(() => {
        coracao.remove();
    }, 6000);
}

setInterval(criarCoracao, 300);
</script>

</body>
</html>
