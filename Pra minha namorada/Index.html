<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Para minha Laninha ❤️</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    font-family: Arial, sans-serif;
    text-align: center;
    color: white;
    overflow: hidden;
}

.container {
    margin-top: 120px;
}

h1 {
    font-size: 42px;
}

p {
    font-size: 20px;
}

button {
    background: white;
    color: #ff4d6d;
    border: none;
    padding: 15px 25px;
    font-size: 18px;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
    background: #ffe6ec;
}

.heart {
    position: fixed;
    font-size: 20px;
    animation: subir 6s linear infinite;
}

@keyframes subir {
    from {
        transform: translateY(100vh);
        opacity: 1;
    }
    to {
        transform: translateY(-10vh);
        opacity: 0;
    }
}

.msg {
    margin-top: 20px;
    font-size: 22px;
    display: none;
}
</style>
</head>

<body>

<div class="container">
    <h1>Para minha Laninha 💖</h1>
    <p>Você é a melhor coisa que me aconteceu ❤️</p>

    <button onclick="iniciar()">Clique aqui 💘</button>

    <div class="msg" id="msg">
        Eu te amo muito 💞 nunca esquece disso!
    </div>

    <br><br>

    <audio id="musica">
        <source src="musica.mp3" type="audio/mpeg">
    </audio>
</div>

<script>
function iniciar() {
    document.getElementById("musica").play();
    document.getElementById("msg").style.display = "block";
}

// corações subindo
function criarCoracao() {
    const coracao = document.createElement("div");
    coracao.classList.add("heart");
    coracao.innerHTML = "❤️";

    coracao.style.left = Math.random() * 100 + "vw";
    coracao.style.fontSize = (Math.random() * 20 + 10) + "px";

    document.body.appendChild(coracao);

    setTimeout(() => {
        coracao.remove();
    }, 6000);
}

setInterval(criarCoracao, 400);
</script>

</body>
</html>
